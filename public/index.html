<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeFluent — Learn to Type</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⌨️</text></svg>" />
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="brand" href="#/lessons">⌨️ <span>TypeFluent</span></a>
      <div class="nav-links">
        <a href="#/lessons" data-nav="lessons">Lessons</a>
        <a href="#/test" data-nav="test">Speed Test</a>
      </div>
      <button id="user-chip" class="user-chip" title="Change learner">👤 <span id="user-name">Sign in</span></button>
    </div>
  </nav>

  <main id="app" class="app"></main>

  <!-- Onboarding / change-name modal -->
  <div id="user-modal" class="modal hidden">
    <div class="modal-card">
      <h2>Who's learning?</h2>
      <p class="muted">Enter a name so we can track your lesson progress.</p>
      <form id="user-form">
        <input id="user-input" type="text" maxlength="40" placeholder="Your name" autocomplete="off" required />
        <button type="submit" class="btn btn-primary">Start Learning</button>
      </form>
    </div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>

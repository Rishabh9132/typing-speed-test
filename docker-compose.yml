services:

  db:
    image: postgres:16-alpine
    container_name: typefluent_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       postgres
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: typefluent_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT:        3000
      DB_DIALECT:  postgres
      DB_ADDRESS:  db
      DB_PORT:     5432
      DB_USER:     postgres
      DB_PASSWORD: admin
      DB_NAME:     postgres
      DB_DEBUG:    "false"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
